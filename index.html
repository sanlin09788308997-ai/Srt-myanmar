<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Srt myanmar - Free SRT Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">
    <header class="bg-slate-800 border-b border-slate-700 py-4 px-6 text-center">
        <h1 class="text-2xl font-bold text-emerald-400">Srt myanmar</h1>
        <p class="text-xs text-slate-400 mt-1">ပိုက်ဆံမကုန်ဘဲ အခမဲ့ အသုံးပြုနိုင်သော Srt ဖိုင်စီမံစနစ်</p>
    </header>
    <main class="max-w-md mx-auto w-full p-4 flex-grow flex flex-col gap-5">
        
        <!-- SRT File Upload Section -->
        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-lg">
            <label class="block text-sm font-medium mb-2 text-slate-300">မူရင်း စာတန်းထိုးဖိုင် (.srt) ကို ရွေးချယ်ပါ</label>
            <input type="file" id="srtInput" accept=".srt,text/plain" class="w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-emerald-600 file:text-white hover:file:bg-emerald-700 cursor-pointer">
            <div id="fileInfo" class="mt-2 text-xs text-emerald-400 font-medium hidden"></div>
        </div>

        <button id="generateBtn" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition-all disabled:opacity-50 disabled:cursor-not-allowed" disabled>
            Srt ဖိုင်ကို အခမဲ့ ထုတ်မည်
        </button>
        
        <div id="statusBox" class="hidden bg-slate-800 p-4 rounded-xl border border-slate-700 text-center">
            <div class="inline-block animate-spin rounded-full h-6 w-6 border-b-2 border-emerald-400 mb-2"></div>
            <p id="statusText" class="text-sm text-slate-300">ဖိုင်ကို စီစဉ်ဆောင်ရွက်နေပါသည်...</p>
        </div>

        <div id="resultBox" class="hidden bg-slate-800 p-4 rounded-xl border border-slate-700 text-center flex flex-col gap-3">
            <p class="text-sm text-emerald-400 font-medium">✨ Srt ဖိုင် အောင်မြင်စွာ အဆင်သင့်ဖြစ်ပါပြီ!</p>
            <button id="saveBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-4 rounded-lg shadow transition-all">
                📥 ဖုန်းထဲသို့ Save ၍ QuickEdit ဖြင့်ဖွင့်မည်
            </button>
        </div>
    </main>
    <footer class="bg-slate-800 border-t border-slate-700 py-3 text-center text-xs text-slate-500">
        &copy; 2026 Srt myanmar. All rights reserved.
    </footer>

    <script>
        const srtInput = document.getElementById('srtInput');
        const fileInfo = document.getElementById('fileInfo');
        const generateBtn = document.getElementById('generateBtn');
        const statusBox = document.getElementById('statusBox');
        const statusText = document.getElementById('statusText');
        const resultBox = document.getElementById('resultBox');
        const saveBtn = document.getElementById('saveBtn');
        
        let selectedFileContent = "";
        let selectedFileName = "";
        let finalSrtOutput = "";

        srtInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                selectedFileName = file.name;
                fileInfo.textContent = `✅ ရွေးချယ်ထားသောဖိုင်: ${file.name}`;
                fileInfo.classList.remove('hidden');
                
                const reader = new FileReader();
                reader.onload = function(event) {
                    selectedFileContent = event.target.result;
                    generateBtn.disabled = false;
                };
                reader.readAsText(file);
            } else {
                fileInfo.classList.add('hidden');
                generateBtn.disabled = true;
            }
        });

        generateBtn.addEventListener('click', () => {
            if (!selectedFileContent) return;

            statusBox.classList.remove('hidden');
            resultBox.classList.add('hidden');
            generateBtn.disabled = true;

            setTimeout(() => {
                statusBox.classList.add('hidden');
                finalSrtOutput = selectedFileContent;
                resultBox.classList.remove('hidden');
                generateBtn.disabled = false;
            }, 500);
        });

        saveBtn.addEventListener('click', () => {
            const blob = new Blob([finalSrtOutput], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            const baseName = selectedFileName ? selectedFileName.substring(0, selectedFileName.lastIndexOf('.')) : 'subtitle';
            a.download = `${baseName}_free.srt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });
    </script>
</body>
</html>
