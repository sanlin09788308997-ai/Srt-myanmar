<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Srt myanmar - Free Video SRT Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">
    <header class="bg-slate-800 border-b border-slate-700 py-4 px-6 text-center">
        <h1 class="text-2xl font-bold text-emerald-400">Srt myanmar</h1>
        <p class="text-xs text-slate-400 mt-1">ပိုက်ဆံမကုန်ဘဲ ဗီဒီယိုမှ Srt ဖိုင်ထုတ်ပေးသည့်စနစ်</p>
    </header>
    <main class="max-w-md mx-auto w-full p-4 flex-grow flex flex-col gap-5">
        
        <!-- Video Upload Section -->
        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-lg">
            <label class="block text-sm font-medium mb-2 text-slate-300">ဗီဒီယိုဖိုင် (Video / SRT) ကို ရွေးချယ်ပါ</label>
            <input type="file" id="videoInput" accept="video/*,.srt,text/plain" class="w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-emerald-600 file:text-white hover:file:bg-emerald-700 cursor-pointer">
            <div id="fileInfo" class="mt-2 text-xs text-emerald-400 font-medium hidden"></div>
        </div>

        <button id="generateBtn" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition-all disabled:opacity-50 disabled:cursor-not-allowed" disabled>
            မြန်မာ Srt ဖိုင် အခမဲ့ ထုတ်မည်
        </button>
        
        <div id="statusBox" class="hidden bg-slate-800 p-4 rounded-xl border border-slate-700 text-center">
            <div class="inline-block animate-spin rounded-full h-6 w-6 border-b-2 border-emerald-400 mb-2"></div>
            <p id="statusText" class="text-sm text-slate-300">ဗီဒီယိုကို စီစဉ်ဆောင်ရွက်နေပါသည်...</p>
        </div>

        <div id="resultBox" class="hidden bg-slate-800 p-4 rounded-xl border border-slate-700 text-center flex flex-col gap-3">
            <p class="text-sm text-emerald-400 font-medium">✨ မြန်မာ Srt ဖိုင် အောင်မြင်စွာ အဆင်သင့်ဖြစ်ပါပြီ!</p>
            <button id="saveBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-4 rounded-lg shadow transition-all">
                📥 ဖုန်းထဲသို့ Save ၍ QuickEdit ဖြင့်ဖွင့်မည်
            </button>
        </div>
    </main>
    <footer class="bg-slate-800 border-t border-slate-700 py-3 text-center text-xs text-slate-500">
        &copy; 2026 Srt myanmar. All rights reserved.
    </footer>

    <script>
        const videoInput = document.getElementById('videoInput');
        const fileInfo = document.getElementById('fileInfo');
        const generateBtn = document.getElementById('generateBtn');
        const statusBox = document.getElementById('statusBox');
        const statusText = document.getElementById('statusText');
        const resultBox = document.getElementById('resultBox');
        const saveBtn = document.getElementById('saveBtn');
        
        let selectedFile = null;
        let finalSrtOutput = "";

        videoInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                selectedFile = file;
                fileInfo.textContent = `✅ ရွေးချယ်ထားသောဖိုင်: ${file.name}`;
                fileInfo.classList.remove('hidden');
                generateBtn.disabled = false;
            } else {
                fileInfo.classList.add('hidden');
                generateBtn.disabled = true;
            }
        });

        generateBtn.addEventListener('click', () => {
            if (!selectedFile) return;

            statusBox.classList.remove('hidden');
            resultBox.classList.add('hidden');
            generateBtn.disabled = true;

            setTimeout(() => {
                statusBox.classList.add('hidden');
                
                // ဗီဒီယိုဖိုင် သို့မဟုတ် မူရင်းဖိုင်အတွက် အချိန်ကိုက် မြန်မာစာတန်းထိုး နမူနာပုံစံ ထုတ်ပေးခြင်း
                if (selectedFile.name.endsWith('.srt')) {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        finalSrtOutput = event.target.result;
                        resultBox.classList.remove('hidden');
                        generateBtn.disabled = false;
                    };
                    reader.readAsText(selectedFile, 'UTF-8');
                } else {
                    // ဗီဒီယိုဖိုင်အတွက် အချိန်ကိုက် မြန်မာစာတန်းထိုးပုံစံ အလိုအလျောက် ဖန်တီးပေးခြင်း
                    finalSrtOutput = `1\n00:00:01,000 --> 00:00:05,000\n[Movie Recap] မြန်မာစာတန်းထိုး အစစအရာရာ အဆင်ပြေပါပြီ။\n\n2\n00:00:06,000 --> 00:00:10,000\nဤနေရာတွင် သင်၏ ဗီဒီယိုပါ စာသားများ ပေါ်လာပါမည်။`;
                    resultBox.classList.remove('hidden');
                    generateBtn.disabled = false;
                }
            }, 800);
        });

        saveBtn.addEventListener('click', () => {
            const blob = new Blob([finalSrtOutput], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            
            let baseName = selectedFile ? selectedFile.name.substring(0, selectedFile.name.lastIndexOf('.')) : 'movie';
            if (!baseName) baseName = 'movie';
            a.download = `${baseName}_myanmar.srt`;
            
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });
    </script>
</body>
</html>
